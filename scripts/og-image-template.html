<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        /* Geometric background elements */
        .bg-circle-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, rgba(239, 68, 68, 0) 70%);
            top: -200px;
            right: -100px;
        }

        .bg-circle-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0) 70%);
            bottom: -150px;
            left: -100px;
        }

        .bg-stripe {
            position: absolute;
            width: 300px;
            height: 800px;
            background: linear-gradient(45deg, rgba(239, 68, 68, 0.05) 0%, rgba(239, 68, 68, 0.15) 100%);
            transform: rotate(-15deg);
            right: 100px;
            top: -100px;
        }

        /* Main content container */
        .container {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 100px;
        }

        /* Logo/Brand */
        .logo {
            font-size: 120px;
            font-weight: 900;
            color: #ef4444;
            letter-spacing: -3px;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            line-height: 1;
        }

        .com {
            color: #ffffff;
            font-size: 90px;
        }

        /* Tagline */
        .tagline {
            font-size: 48px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 24px;
            line-height: 1.2;
            max-width: 900px;
        }

        /* Description */
        .description {
            font-size: 32px;
            font-weight: 700;
            color: #94a3b8;
            line-height: 1.4;
            max-width: 850px;
        }

        /* Accent bar */
        .accent-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 12px;
            background: linear-gradient(90deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);
        }

        /* Top accent */
        .top-badge {
            position: absolute;
            top: 50px;
            right: 100px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            font-size: 24px;
            font-weight: 800;
            padding: 16px 32px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>
    <div class="bg-stripe"></div>

    <div class="top-badge">AI-POWERED</div>

    <div class="container">
        <div class="logo">
            eKaty<span class="com">.com</span>
        </div>

        <div class="tagline">
            Discover Katy's Best Restaurants
        </div>

        <div class="description">
            500+ Local Restaurants • Interactive Map • Grub Roulette
        </div>
    </div>

    <div class="accent-bar"></div>
</body>
</html>
