<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eKaty OG Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            width: 1200px;
            height: 630px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            overflow: hidden;
        }

        /* Photo grid cells */
        .photo {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* Real food photography from Unsplash */
        .photo-1 {
            background-image: url('https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=600&q=80');
        }
        .photo-2 {
            background-image: url('https://images.unsplash.com/photo-1544025162-d76694265947?w=600&q=80');
        }
        .photo-3 {
            background-image: url('https://images.unsplash.com/photo-1563245372-f21724e3856d?w=600&q=80');
        }
        .photo-4 {
            background-image: url('https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?w=600&q=80');
        }
        .photo-5 {
            background-image: url('https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=600&q=80');
        }
        .photo-6 {
            background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&q=80');
        }
        .photo-7 {
            background-image: url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=600&q=80');
        }
        .photo-8 {
            background-image: url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=600&q=80');
        }

        /* Dark overlay for text readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(15, 23, 42, 0.88) 0%,
                rgba(30, 58, 138, 0.75) 40%,
                rgba(220, 38, 38, 0.65) 70%,
                rgba(234, 88, 12, 0.75) 100%
            );
            z-index: 5;
        }

        /* Content on top of overlay */
        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 80px;
            text-align: center;
        }

        /* Accent bar at top */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg,
                #f59e0b 0%,
                #ef4444 25%,
                #8b5cf6 50%,
                #06b6d4 75%,
                #10b981 100%
            );
            z-index: 20;
        }

        /* Accent bar at bottom */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg,
                #10b981 0%,
                #06b6d4 25%,
                #8b5cf6 50%,
                #ef4444 75%,
                #f59e0b 100%
            );
            z-index: 20;
        }

        .logo {
            font-size: 110px;
            font-weight: 900;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            letter-spacing: -3px;
            line-height: 1;
        }

        .logo span {
            color: #fbbf24;
        }

        .tagline {
            font-size: 38px;
            color: white;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
        }

        .divider {
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, #f59e0b, #ef4444, #f59e0b);
            border-radius: 2px;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 26px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        .subtitle .highlight {
            color: #fbbf24;
            font-weight: 700;
        }

        /* Category pills */
        .pills {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pill {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .pill.accent {
            background: rgba(245, 158, 11, 0.3);
            border-color: rgba(245, 158, 11, 0.5);
            color: #fde68a;
        }

        /* Texas star decoration */
        .star {
            position: absolute;
            z-index: 15;
            font-size: 28px;
            opacity: 0.6;
        }
        .star-1 { top: 30px; left: 40px; }
        .star-2 { top: 30px; right: 40px; }
        .star-3 { bottom: 30px; left: 40px; }
        .star-4 { bottom: 30px; right: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Photo grid background -->
        <div class="photo photo-1"></div>
        <div class="photo photo-2"></div>
        <div class="photo photo-3"></div>
        <div class="photo photo-4"></div>
        <div class="photo photo-5"></div>
        <div class="photo photo-6"></div>
        <div class="photo photo-7"></div>
        <div class="photo photo-8"></div>

        <!-- Color overlay -->
        <div class="overlay"></div>

        <!-- Accent bars -->
        <div class="top-bar"></div>
        <div class="bottom-bar"></div>

        <!-- Texas stars -->
        <div class="star star-1">&#9734;</div>
        <div class="star star-2">&#9734;</div>
        <div class="star star-3">&#9734;</div>
        <div class="star star-4">&#9734;</div>

        <!-- Main content -->
        <div class="content">
            <div class="logo">e<span>Katy</span></div>
            <div class="tagline">Katy's Best Restaurant Guide</div>
            <div class="divider"></div>
            <div class="subtitle"><span class="highlight">500+</span> Restaurants &bull; BBQ &bull; Tex-Mex &bull; Asian &bull; Seafood</div>
            <div class="pills">
                <span class="pill">&#127790; Tacos</span>
                <span class="pill accent">&#127830; BBQ</span>
                <span class="pill">&#127836; Pho</span>
                <span class="pill accent">&#127843; Sushi</span>
                <span class="pill">&#127828; Burgers</span>
                <span class="pill accent">&#9733; Katy TX</span>
            </div>
        </div>
    </div>
</body>
</html>
